substitutions:
  friendly_name: 4848s040
  device_name: "guition-esp32-s3-4848s040"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: false
  compile_process_limit: 2
  libraries:
    - TeslaBLE=https://github.com/PedroKTFC/tesla-ble.git
  on_boot:
    priority: -10
    then:
      - script.execute: screen_timeout_timer

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 8MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 3600s 
  ap:
    ssid: "${friendly_name} Hotspot"
    password: "password123"

captive_portal:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

web_server:
  port: 80
  version: 2

logger:
  level: DEBUG

dashboard_import:
  package_import_url: github://PedroKTFC/esphome-tesla-ble/packages/client.yml

external_components:
  - source: github://PedroKTFC/esphome-tesla-ble

esp32_ble_tracker:
  scan_parameters:
    active: true

packages:
  base: github://PedroKTFC/esphome-tesla-ble/packages/base.yml
  common: github://PedroKTFC/esphome-tesla-ble/packages/common.yml
  project: github://PedroKTFC/esphome-tesla-ble/packages/project.yml
  client: github://PedroKTFC/esphome-tesla-ble/packages/client.yml

# --- CONFIGURATION TESLA ---
tesla_ble_vehicle:
  id: tesla_ble_vehicle_id
  wake_on_boot: true 
  charge_state:
    id: tesla_soc
    on_value:
      then:
        - lvgl.label.update:
            id: charge_level_label
            text: !lambda 'static char buf[10]; sprintf(buf, "%.0f %%", x); return buf;'
        - lvgl.arc.update:
            id: charge_level_arc
            value: !lambda "return x;"

# --- IMAGES ---
image:
  - file: "images/charger_unplugged.jpg"
    id: img_unplugged
    type: RGB565
  - file: "images/parametres.jpg"
    id: img_params
    type: RGB565
  - file: "images/wifi/pas-de-wifi.jpg"
    id: img_wifi_none
    type: RGB565
  - file: "images/wifi/signal-wi-fi-0-25.jpg"
    id: img_wifi_0_25
    type: RGB565
  - file: "images/wifi/signal-wi-fi-25-50.jpg"
    id: img_wifi_25_50
    type: RGB565
  - file: "images/wifi/signal-wi-fi-50-75.jpg"
    id: img_wifi_50_75
    type: RGB565
  - file: "images/wifi/signal-wi-fi-75-100.jpg"
    id: img_wifi_75_100
    type: RGB565
  - file: "images/bluetouth/pas-de-bluetouth.jpg"
    id: img_ble_none
    type: RGB565
  - file: "images/bluetouth/bluetouth-0-25.jpg"
    id: img_ble_0_25
    type: RGB565
  - file: "images/bluetouth/bluetouth-25-50.jpg"
    id: img_ble_25_50
    type: RGB565
  - file: "images/bluetouth/bluetouth-50-75.jpg"
    id: img_ble_50_75
    type: RGB565
  - file: "images/bluetouth/bluetouth-75-100.jpg"
    id: img_ble_75_100
    type: RGB565

# --- CAPTEURS ---
sensor:
  - platform: wifi_signal
    id: wifi_rssi
    update_interval: 10s
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    on_value:
      then:
        - lvgl.image.update:
            id: wifi_icon_widget
            src: !lambda |-
              if (isnan(x)) return img_wifi_none;
              if (x < 25) return img_wifi_0_25;
              if (x < 50) return img_wifi_25_50;
              if (x < 75) return img_wifi_50_75;
              return img_wifi_75_100;

binary_sensor:
  - platform: template
    id: ble_status_display
    lambda: |-
      return id(sw_ble_connection).state;
    on_state:
      then:
        - lvgl.image.update:
            id: ble_icon_widget
            src: !lambda "return x ? img_ble_75_100 : img_ble_none;"

# --- PARAMÈTRES EXPOSÉS ---
number:
  - platform: template
    name: "Délai extinction écran"
    id: screen_timeout_delay
    unit_of_measurement: "s"
    min_value: 5
    max_value: 300
    step: 5
    initial_value: 60
    optimistic: true
    restore_value: true
    entity_category: "config"
    icon: "mdi:timer-sand"

  - platform: template
    name: "Luminosité écran"
    id: screen_brightness_config
    unit_of_measurement: "%"
    min_value: 10
    max_value: 100
    step: 1
    initial_value: 80
    optimistic: true
    restore_value: true
    entity_category: "config"
    icon: "mdi:brightness-6"
    on_value:
      then:
        - light.control:
            id: display_backlight
            brightness: !lambda "return x / 100.0;"

script:
  - id: screen_timeout_timer
    mode: restart
    then:
      - light.turn_on:
          id: display_backlight
          brightness: !lambda "return id(screen_brightness_config).state / 100.0;"
      - delay: !lambda "return id(screen_timeout_delay).state * 1000;"
      - light.turn_off:
          id: display_backlight
          transition_length: 2s

output:
  - platform: ledc
    id: backlight_output
    pin: GPIO38
    frequency: 150Hz

light:
  - platform: monochromatic
    name: Backlight
    id: display_backlight
    output: backlight_output
    internal: true

# --- MATÉRIEL ---
spi:
  - id: lcd_spi
    clk_pin: GPIO48
    mosi_pin: GPIO47

i2c:
  id: touchscreen_bus
  sda: GPIO19
  scl: {number: 45, ignore_strapping_warning: true}

display:
  - platform: st7701s
    id: tft_display
    dimensions: {width: 480, height: 480}
    spi_mode: MODE3
    data_rate: 2MHz
    color_order: RGB
    invert_colors: False
    cs_pin: 39
    de_pin: 18
    hsync_pin: 16
    vsync_pin: 17
    pclk_pin: 21
    pclk_frequency: 12MHz
    pclk_inverted: False
    hsync_pulse_width: 8
    hsync_front_porch: 10
    hsync_back_porch: 20
    vsync_pulse_width: 8
    vsync_front_porch: 10
    vsync_back_porch: 10
    update_interval: never
    auto_clear_enabled: False
    init_sequence:
      - 1
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x10]
      - [0xCD, 0x00]
    data_pins:
      red: [11, 12, 13, 14, 0]
      green: [8, 20, 3, 46, 9, 10]
      blue: [4, 5, 6, 7, 15]

touchscreen:
  - platform: gt911
    id: tft_touch
    display: tft_display
    on_touch:
      - script.execute: screen_timeout_timer

font:
  - file: {type: gfonts, family: Roboto}
    id: font_main
    size: 20
    glyphs: "0123456789% -.!WiFfBLEOPTXumk"

# --- INTERFACE LVGL ---
lvgl:
  displays: tft_display
  buffer_size: 10%
  pages:
    - id: main_page
      widgets:
        - image: {src: img_unplugged, align: CENTER, y: 35, zoom: 0.75}
        - arc:
            id: charge_level_arc
            align: CENTER
            y: 35
            width: 210
            height: 210
            start_angle: 210
            end_angle: 330
            arc_width: 8
            arc_color: 0x333333
            min_value: 0
            max_value: 100
            indicator: {line_color: 0x00AEEF, line_width: 8}
        - label: {id: charge_level_label, align: CENTER, y: 120, text: "-- %", text_font: font_main}

        - obj:
            height: 60
            width: 100%
            align: TOP_MID
            bg_opa: 0%
            border_width: 0
            shadow_width: 0
            widgets:
              - button:
                  width: 60
                  height: 50
                  align: LEFT_MID
                  x: 10
                  bg_opa: 0%
                  border_width: 0
                  shadow_width: 0
                  on_click: {then: [lvgl.page.show: settings_page]}
                  widgets:
                    - image:
                        src: img_params
                        align: CENTER
              - image:
                  id: wifi_icon_widget
                  src: img_wifi_none
                  align: RIGHT_MID
                  x: -15
              - image:
                  id: ble_icon_widget
                  src: img_ble_none
                  align: RIGHT_MID
                  x: -90

    - id: settings_page
      widgets:
        - obj:
            width: 100%
            height: 100%
            bg_color: 0x1A1A1A
            widgets:
              - button:
                  align: TOP_RIGHT
                  x: -15
                  y: 10
                  width: 50
                  height: 40
                  bg_color: 0xE53935
                  border_width: 0
                  shadow_width: 0
                  on_click: {then: [lvgl.page.show: main_page]}
                  widgets: [{label: {text: "X", text_font: font_main, align: CENTER}}]
              - label: {text: "Lum", align: TOP_LEFT, x: 30, y: 80, text_color: 0xFFFFFF, text_font: font_main}
              - slider:
                  id: brightness_slider
                  align: TOP_MID
                  y: 125
                  width: 80%
                  min_value: 10
                  max_value: 100
                  value: !lambda "return id(screen_brightness_config).state;"
                  on_value:
                    then:
                      - number.set:
                          id: screen_brightness_config
                          value: !lambda "return x;"
