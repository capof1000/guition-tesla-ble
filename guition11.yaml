display: #b1
  - platform: st7701s
    id: tft_display
    dimensions:
      width: 480
      height: 480
    #    rotation: 270    #uncomment for placement with down-facing USB socket
    spi_mode: MODE3
    data_rate: 2MHz
    color_order: RGB
    invert_colors: False
    cs_pin: 39
    de_pin: 18
    hsync_pin: 16
    vsync_pin: 17
    pclk_pin: 21
    pclk_frequency: 12MHz
    pclk_inverted: False
    hsync_pulse_width: 8
    hsync_front_porch: 10
    hsync_back_porch: 20
    vsync_pulse_width: 8
    vsync_front_porch: 10
    vsync_back_porch: 10
    update_interval: never
    auto_clear_enabled: False
    init_sequence:
      - 1
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x10] # CMD2_BKSEL_BK0
      - [0xCD, 0x00] # disable MDT flag
    data_pins:
      red: [11, 12, 13, 14, 0]
      green: [8, 20, 3, 46, 9, 10]
      blue: [4, 5, 6, 7, 15]

touchscreen:
  - platform: gt911
    id: tft_touch
    display: tft_display
    on_touch:
      - script.execute: screen_timeout_timer

font:
  - file: { type: gfonts, family: Roboto }
    id: font_main
    size: 24

image:
  - { file: "images/charger_unplugged.jpg", id: img_unplugged, type: RGB565 }
  - { file: "images/charger_plugged.jpg", id: img_plugged, type: RGB565 }
  - { file: "images/charger_charging.jpg", id: img_charging, type: RGB565 }
  - { file: "images/parametres.jpg", id: img_params, type: RGB565 }
  - { file: "images/wifi/pas-de-wifi.jpg", id: img_wifi_none, type: RGB565 }
  - { file: "images/wifi/signal-wi-fi-75-100.jpg", id: img_wifi_full, type: RGB565 }
  - { file: "images/bluetouth/pas-de-bluetouth.jpg", id: img_ble_none, type: RGB565 }
  - { file: "images/bluetouth/bluetouth-75-100.jpg", id: img_ble_full, type: RGB565 }

# --- CONFIGURATION ENTITIES ---
number:
  - platform: template
    name: "Screen GTW backlight"
    id: screen_brightness_config
    min_value: 55
    max_value: 100
    step: 1
    initial_value: 80
    optimistic: true
    restore_value: true
    entity_category: config
    on_value:
      then:
        - light.control: { id: display_backlight, brightness: !lambda "return x / 100.0;" }

  - platform: template
    name: "Screen GTW delay"
    id: screen_timeout_config
    min_value: 15
    max_value: 3600
    step: 1
    initial_value: 60
    optimistic: true
    restore_value: true
    entity_category: config
    on_value:
      then:
        - lvgl.label.update:
            id: delay_value_label
            text: !lambda 'static char buf[20]; sprintf(buf, "%.0f s", x); return buf;'
        - script.execute: screen_timeout_timer

select:
  - platform: template
    name: "Logger Level"
    id: logger_level_config
    optimistic: true
    restore_value: true
    entity_category: config
    options: [NONE, ERROR, WARN, INFO, DEBUG, VERBOSE]
    initial_option: INFO
    on_value:
      then:
        - lambda: |-
            if (x == "NONE") esp_log_level_set("*", ESP_LOG_NONE);
            else if (x == "ERROR") esp_log_level_set("*", ESP_LOG_ERROR);
            else if (x == "WARN") esp_log_level_set("*", ESP_LOG_WARN);
            else if (x == "INFO") esp_log_level_set("*", ESP_LOG_INFO);
            else if (x == "DEBUG") esp_log_level_set("*", ESP_LOG_DEBUG);
            else if (x == "VERBOSE") esp_log_level_set("*", ESP_LOG_VERBOSE);

# --- LVGL UI ---
lvgl:
  displays: tft_display
  buffer_size: 10%
  pages:
    - id: main_page
      widgets:
        - image: { id: vehicle_image_widget, src: img_unplugged, align: CENTER, zoom: 0.75 }
        
        #Arc de limite
        - arc:
            id: charge_limit_arc
            align: CENTER
            width: 320
            height: 320
            start_angle: 150
            end_angle: 30
            arc_width: 12
            indicator: { arc_color: 0x00AEEF, arc_width: 12 }
            
            #knob: #b2#
            #  bg_color: 0xFFFFFF
            #  radius: 5

            adjustable: true
            on_value:
              then:
                - homeassistant.service:
                    service: number.set_value
                    data:
                      entity_id: number.${device_name}_charge_limit
                      value: !lambda "return to_string((int)x);"

        - arc:
            id: charge_level_arc
            align: CENTER
            width: 320
            height: 320
            start_angle: 150
            end_angle: 30
            arc_width: 12
            bg_opa: 0%
            indicator: { arc_color: 0x2ECC71, arc_width: 13 }
            adjustable: false

        - slider:
            id: amps_slider
            width: 20
            height: 250
            align: RIGHT_MID
            x: -20
            min_value: 5
            max_value: 32
            indicator:
              bg_color: 0x2ECC71
              bg_grad_color: 0x1B5E20
              bg_grad_dir: VER
            knob:
              bg_color: 0xFFFFFF
              radius: 5
            on_value:
              then:
                - homeassistant.service:
                    service: number.set_value
                    data:
                      entity_id: number.${device_name}_current_limit
                      value: !lambda "return to_string((int)x);"
        
        #niveau de batterie
        #- label: { id: charge_level_label, align: CENTER, y: 140, text: "-- %", text_font: font_main }
        #limit

        - label: { id: charge_limit_label, align: CENTER, y: 140, text: "Limit: --%", text_font: font_main, text_color: 0x888888 }
        #limite de puissance #b4
        - label: { id: charge_power_label, align: RIGHT_MID, x: 10, y: 155, text: " --A", text_font: font_main, text_color: 0x888888 }
        

        #Barre superieure
        - obj:
            height: 60
            width: 100%
            align: TOP_MID
            bg_opa: 0%
            widgets:
              - button:
                  width: 60
                  height: 50
                  align: LEFT_MID
                  x: 10
                  on_click: { then: [ lvgl.page.show: settings_page ] }
                  widgets: [ image: { src: img_params, align: CENTER } ]
              
              - label: { id: charge_level_label, align: RIGHT_MID, x: -15, text: "-- %", text_font: font_main }
              - image: { id: wifi_icon_widget, src: img_wifi_none, align: RIGHT_MID, x: -90 }
              #- image: { id: ble_icon_widget, src: img_ble_none, align: RIGHT_MID, x: -165 }
              - image: { id: ble_icon_widget, src: img_ble_none, align: RIGHT_MID, x: -145 } #b3


    - id: settings_page
      widgets:
        - obj:
            width: 100%
            height: 100%
            bg_color: 0x1A1A1A
            widgets:
              - button:
                  align: TOP_RIGHT
                  x: -15
                  y: 10
                  width: 50
                  height: 40
                  bg_color: 0xE53935
                  on_click: { then: [ lvgl.page.show: main_page ] }
                  widgets: [ label: { text: "X", text_font: font_main, align: CENTER } ]
              
              - label: { text: "Luminosité", align: TOP_LEFT, x: 30, y: 60, text_color: 0xFFFFFF, text_font: font_main }
              - slider:
                  align: TOP_MID
                  y: 100
                  width: 80%
                  min_value: 55
                  max_value: 100
                  on_value: { then: [ number.set: { id: screen_brightness_config, value: !lambda "return x;" } ] }
              
              - label: { text: "Timeout", align: TOP_LEFT, x: 30, y: 180, text_color: 0xFFFFFF, text_font: font_main }
              - label: { id: delay_value_label, align: TOP_RIGHT, x: -30, y: 180, text: "60 s", text_color: 0x00AEEF, text_font: font_main }
              - slider:
                  align: TOP_MID
                  y: 220
                  width: 80%
                  min_value: 15
                  max_value: 3600
                  on_value: { then: [ number.set: { id: screen_timeout_config, value: !lambda "return x;" } ] }

              - dropdown:
                  align: BOTTOM_MID
                  y: -20
                  width: 200
                  options: [NONE, ERROR, WARN, INFO, DEBUG, VERBOSE]
                  on_value:
                    then:
                      - select.set:
                          id: logger_level_config
                          option: !lambda |-
                            static const char* opts[] = {"NONE", "ERROR", "WARN", "INFO", "DEBUG", "VERBOSE"};
                            return opts[x];
