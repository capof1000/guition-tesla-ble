#Points clés de cette version :
#Stabilité Bluetooth : Utilisation de la version stable v2024.11.1 pour éviter les bugs d'écran noir de la version 2026.
#Mappage des IDs : J'ai relié les capteurs internes de Pedro (battery_level, charge_current, etc.) à vos IDs locaux (tesla_soc, charging_state) pour que vos jauges et images fonctionnent sans modification.
#Correction du Slider : J'ai simplifié le dégradé du slider pour assurer la compilation.
#Restauration des réglages : Le logger_level et les paramètres d'écran sont préservés.
#b1 SI esp crash, il redemarre mais l'ecran reste noir, seule solution le rebrancher
#B2 activer knob sur l'aarc central
#b3 deplace ble icone vers la droite, pour meilleur aspect visuel
#b4 affichier la puissance sous le slider

#slider avec degrade mais semble non fonctionnel# 
# arc vert
# arc vert

# arc vert

substitutions:
  friendly_name: Capof Gateway 11
  device_name: "guition-esp32-s3-4848s040"
  tesla_vin: !secret tesla_vin
  # Substitutions pour piloter le code de Pedro (Dernière version)
  update_interval: 45s
  poll_charging_period: 30s
  poll_data_period: 61s
  poll_asleep_period: 90s
  ble_presence_timeout: 30s

# --- SCRIPTS ---
script:
  - id: update_vehicle_image
    then:
      - lvgl.image.update:
          id: vehicle_image_widget
          src: !lambda |-
            if (id(charging_state).state == "Charging") return img_charging;
            if (id(is_charge_flap_open).state) return img_plugged;
            return img_unplugged;

  - id: screen_timeout_timer
    mode: restart
    then:
      - lvgl.resume: 
      - light.turn_on: 
          id: display_backlight
          brightness: !lambda "return id(screen_brightness_config).state / 100.0;"
      - delay: !lambda "return id(screen_timeout_config).state * 1000;"
      - light.turn_off: 
          id: display_backlight
          transition_length: 2s
      - lvgl.pause: 

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  platformio_options:
    build_flags:
      - -DCONFIG_ARDUINO_LOOP_STACK_SIZE=32768
      - -DCONFIG_BT_BLE_DYNAMIC_ENV_MEMORY=1

  on_boot:
    #priority: -100
    priority: 600 # Priorité haute pour agir AVANT le reste . doit empecher l'ecran noir apres crash b1
    then:
      - light.turn_on:
          id: display_backlight
          brightness: 100% # On force l'allumage immédiat
      - script.execute: screen_timeout_timer
      - lambda: |-
          auto level = id(logger_level_config).current_option();
          if (level == "NONE") esp_log_level_set("*", ESP_LOG_NONE);
          else if (level == "ERROR") esp_log_level_set("*", ESP_LOG_ERROR);
          else if (level == "WARN") esp_log_level_set("*", ESP_LOG_WARN);
          else if (level == "INFO") esp_log_level_set("*", ESP_LOG_INFO);
          else if (level == "DEBUG") esp_log_level_set("*", ESP_LOG_DEBUG);
          else if (level == "VERBOSE") esp_log_level_set("*", ESP_LOG_VERBOSE);
     

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 8MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP_TASK_WDT_TIMEOUT_S: "120"
      CONFIG_ESP_MAIN_TASK_STACK_SIZE: "32768"
      CONFIG_BT_BTC_TASK_STACK_SIZE: "16384"
      CONFIG_BT_NIMBLE_MAX_CONNECTIONS: "1"
      CONFIG_BT_NIMBLE_MEM_ALLOC_MODE_EXTERNAL: "y"

psram:
  mode: octal
  speed: 80MHz

# Active la découverte sur le réseau pour le bouton "Visit"
mdns:
  disabled: false

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 0s 

api:
  encryption:
    key: !secret api_encryption_key

logger:
  level: INFO 

# --- PACKAGES PEDRO (DERNIERE VERSION) ---
external_components:
  - source: github://PedroKTFC/esphome-tesla-ble
    refresh: 1h

packages:
  base: github://PedroKTFC/esphome-tesla-ble/packages/base.yml
  common: github://PedroKTFC/esphome-tesla-ble/packages/common.yml
  project: github://PedroKTFC/esphome-tesla-ble/packages/project.yml
  client: github://PedroKTFC/esphome-tesla-ble/packages/client.yml

# --- CONFIGURATION VÉHICULE ---
tesla_ble_vehicle:
  id: tesla_ble_vehicle_id
  vin: ${tesla_vin}
  charge_state: { id: tesla_soc }
  charge_current: { id: tesla_amps_raw }
  is_charge_flap_open: { id: is_charge_flap_open }
  charging_state:
    id: charging_state
    on_value:
      then:
        - script.execute: update_vehicle_image
  max_soc:
    id: max_soc
    on_value:
      then:
        - if:
            condition: { lambda: 'return !isnan(x);' }
            then:
              - lvgl.arc.update: { id: charge_limit_arc, value: !lambda "return x;" }
              - lvgl.label.update:
                  id: charge_limit_label
                  text: !lambda 'static char buf[20]; sprintf(buf, "Limit: %.0f%%", x); return buf;'

# --- SENSORS & BRIDGE ---
binary_sensor:
  - platform: template
    id: ble_status_monitor
    # Correction : Utilisation de l'ID statique défini dans les packages de Pedro
    lambda: 'return id(esphome_tesla_ble_status).state;'
    on_state:
      then:
        - lvgl.image.update:
            id: ble_icon_widget
            src: !lambda 'return x ? img_ble_full : img_ble_none;'

sensor:
  - platform: wifi_signal
    id: wifi_rssi
    update_interval: 60s 
    on_value:
      then:
        - lvgl.image.update:
            id: wifi_icon_widget
            src: !lambda "return (isnan(x) || x < -90) ? img_wifi_none : img_wifi_full;"
  
  - platform: template
    id: ui_soc_monitor
    lambda: "return id(tesla_soc).state;"
    update_interval: 10s 
    on_value:
      then:
        - lvgl.label.update: { id: charge_level_label, text: !lambda 'static char buf[10]; if(isnan(x)) return "-- %"; sprintf(buf, "%.0f %%", x); return buf;' }
        - lvgl.arc.update: { id: charge_level_arc, value: !lambda "return x;" }

  - platform: template
    id: ui_amps_monitor
    lambda: "return id(tesla_amps_raw).state;"
    update_interval: 10s
    on_value:
      then:
        - lvgl.slider.update: { id: amps_slider, value: !lambda "return x;" }

# --- HARDWARE ---
output:
  - platform: ledc
    id: backlight_output
    pin: GPIO38

light:
  - platform: monochromatic
    id: display_backlight
    output: backlight_output

spi:
  - id: lcd_spi
    clk_pin: GPIO48
    mosi_pin: GPIO47

i2c:
  id: touchscreen_bus
  sda: GPIO19
  scl: { number: 45, ignore_strapping_warning: true }

